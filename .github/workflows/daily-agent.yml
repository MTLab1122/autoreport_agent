name: Daily AI & Tech Intelligence Brief

on:
  schedule:
    # 01:50 UTC = 06:50 AM PKT (Ensures generation & dispatch complete BY 07:00 AM PKT)
    - cron: '50 1 * * *'
    # 02:00 UTC = 07:00 AM PKT (Top of hour delivery & verification)
    - cron: '0 2 * * *'
    # 02:30 UTC = 07:30 AM PKT (Automated catch-up / recovery window)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform dry-run (generate PDF without dispatching live email)'
        required: false
        type: boolean
        default: false
      catch_up:
        description: 'Run catch-up audit to identify and deliver missed cycles'
        required: false
        type: boolean
        default: false
      recipient:
        description: 'Override recipient email address (leave blank for default)'
        required: false
        type: string
        default: ''

concurrency:
  group: daily-intelligence-brief
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-daily-brief:
    name: Run 24h Intelligence Sweep & Dispatch Brief
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure workspace directories exist
        run: |
          mkdir -p reports logs logs/checkpoints

      - name: Execute Daily Intelligence Briefing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          FORWARD_EMAIL: ${{ secrets.FORWARD_EMAIL }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient || secrets.RECIPIENT_EMAIL }}
          TIMEZONE: ${{ secrets.TIMEZONE || 'Asia/Karachi' }}
          SCHEDULE_TIME: ${{ secrets.SCHEDULE_TIME || '07:00' }}
          CATCH_UP_MAX_DAYS: ${{ secrets.CATCH_UP_MAX_DAYS || '7' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--run-now"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.catch_up }}" = "true" ]; then
            python main.py --catch-up
          fi
          python main.py $FLAGS

      - name: Send Failure Alert Notification
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient || secrets.RECIPIENT_EMAIL || secrets.OWNER_EMAIL }}
        run: |
          python -c "
          from emailer import send_failure_alert
          import glob, os
          logs = sorted(glob.glob('logs/*.log'))
          snippet = ''
          if logs:
              try:
                  with open(logs[-1], 'r', encoding='utf-8') as f:
                      snippet = f.read()[-1500:]
              except Exception:
                  pass
          target = os.getenv('RECIPIENT_EMAIL') or os.getenv('GMAIL_USER')
          send_failure_alert(
              error_message='GitHub Actions daily briefing job encountered an error or failed delivery.',
              log_snippet=snippet,
              recipient_email=target
          )
          " || true

      - name: Persist Generated Reports & Audit Ledger to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.pdf logs/dispatch_ledger.json logs/checkpoints/*.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(brief): auto-archive generated reports and dispatch ledger [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          fi

      - name: Upload Brief PDFs and Execution Logs as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-ai-tech-brief-run-${{ github.run_number }}
          path: |
            reports/*.pdf
            logs/*.log
            logs/dispatch_ledger.json
          retention-days: 30
          if-no-files-found: ignore
